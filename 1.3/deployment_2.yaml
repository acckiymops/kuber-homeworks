apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
      initContainers:
      - name: wait-for-service
        image: busybox:latest
        command: ['sh', '-c', 'for i in $(seq 30); do nslookup nginx-svc.default.svc.cluster.local >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1']
